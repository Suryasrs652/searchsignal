version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: searchsignal-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/searchsignal
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/app/evidence_storage
    depends_on:
      - postgres
      - redis
    volumes:
      - evidence_data:/app/evidence_storage

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: searchsignal-web
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    container_name: searchsignal-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: searchsignal
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: searchsignal-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: searchsignal-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data:
  evidence_data:
